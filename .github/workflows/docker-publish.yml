name: Build & Publish Web Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-lint:
    name: Run Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client & server
        run: npm run typecheck

      - name: Build client & server
        run: |
          npm run build
          npm run server:build

      - name: Run Test Suite
        run: npm test

  build-and-publish:
    name: Build & Publish Web Image
    needs: test-and-lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create git tags/releases
      packages: write   # Required to push Docker images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Automatically bump patch version & create git tag
      - name: Bump patch version and create tag
        id: tag_version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main,master
          tag_prefix: v
          initial_version: 1.0.0

      # Setup QEMU for multi-architecture emulation (x86_64 and ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # Setup Docker Buildx with BuildKit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract Docker metadata for Web Image
      - name: Extract Web Docker metadata
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.tag_version.outputs.new_tag }},enable=${{ steps.tag_version.outputs.new_tag != '' }}
            type=raw,value=v${{ steps.tag_version.outputs.new_version }},enable=${{ steps.tag_version.outputs.new_version != '' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Media Cataloger Web UI & Server
            org.opencontainers.image.description=Modern Web UI, Family Tree Explorer, Media Viewer, Face Tagging & REST API for Media Archive Cataloger
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.tag_version.outputs.new_version || github.sha }}

      # Build and push multi-arch image
      - name: Build and push Web Docker image
        id: docker_build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false

      - name: Web Build Summary
        if: always()
        run: |
          echo "### 🚀 Media Cataloger Web Build & Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.tag_version.outputs.new_tag || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.docker_build_web.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
